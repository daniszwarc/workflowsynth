workflow_id: wf_pb_005
# domain: insurance_brokerage
# complexity: 1
# has_security_constraint: false
# primitive_count: 4
# source: Insurance Brokerage Client -- dashboard manual ticket creation (fuente = manual)
steps:
  - id: receive_request
    op: fetch_api
    params:
      endpoint: "/api/tickets"
    output: raw_request

  - id: validate_request
    op: validate_schema
    params:
      input: raw_request
      schema: ticket_creation_schema
    output: validated_request

  - id: upsert_client
    op: write_database
    params:
      input: validated_request
      table: clients
    output: client

  - id: create_ticket
    op: write_database
    params:
      input: validated_request
      table: tickets
    output: ticket
