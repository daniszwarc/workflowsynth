steps:
  - id: receive_transfer_request
    op: fetch_api
    params:
      endpoint: "/mvp/finalizeTransfer.cfm"
    output: transfer_request

  - id: authenticate_admin
    op: authenticate_user
    params:
      role: "admin"
    output: auth_result

  - id: delete_source_history
    op: write_database
    params:
      input: transfer_request
      table: history
    output: transfer_complete
