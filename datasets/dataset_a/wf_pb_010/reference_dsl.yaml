workflow_id: wf_pb_010
# domain: insurance_brokerage
# complexity: 2
# has_security_constraint: false
# primitive_count: 5
# source: Insurance Brokerage Client -- client upsert pattern in ingestion workflows
steps:
  - id: extract_client_identifier
    op: extract_field
    params:
      input: raw_message
      field: "cliente_nombre"
    output: client_identifier

  - id: validate_identifier
    op: validate_schema
    params:
      input: client_identifier
      schema: client_identifier_schema
    output: validated_identifier

  - id: check_existing_client
    op: read_database
    params:
      table: clients
      filter: "nombre = client_identifier"
    output: existing_client

  - id: upsert_client
    op: write_database
    params:
      input: validated_identifier
      table: clients
    output: client_record

  - id: extract_client_id
    op: extract_field
    params:
      input: client_record
      field: "id"
    output: client_id
