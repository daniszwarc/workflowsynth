workflow_id: wf_pb_013
# domain: insurance_brokerage
# complexity: 2
# has_security_constraint: true
# primitive_count: 5
# source: Insurance Brokerage Client -- messages table insert in ingestion workflows
steps:
  - id: extract_message_context
    op: extract_field
    params:
      input: ingestion_context
      field: "message_data"
    output: message_data

  - id: validate_message
    op: validate_schema
    params:
      input: message_data
      schema: message_log_schema
    output: validated_message

  - id: mask_sensitive_content
    op: transform_json
    params:
      input: validated_message
      transformation: "mask_pii_financial"
    output: sanitised_message

  - id: insert_message
    op: write_database
    params:
      input: sanitised_message
      table: messages
    output: message_record

  - id: log_insertion
    op: log_audit
    params:
      input: message_record
      action: "message_logged" 
