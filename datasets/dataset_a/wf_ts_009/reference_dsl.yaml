workflow_id: wf_ts_009
# domain: community_sports
# complexity: 3
# has_security_constraint: true
# primitive_count: 5
# source: Community Sports Club -- sendMail.cfm/sendMailParents.cfm (bulk email to club members)
steps:
  - id: receive_email_form
    op: fetch_api
    params:
      endpoint: "/admin/sendMail.cfm"
    output: email_form

  - id: authenticate_admin
    op: authenticate_user
    params:
      role: "admin"
    output: auth_result

  - id: read_recipient_group
    op: read_database
    params:
      table: users
      filter: "role = email_form.recipient_group"
    output: recipients

  - id: filter_valid_emails
    op: filter_records
    params:
      input: recipients
      condition: "email IS NOT NULL"
    output: valid_recipients

  - id: send_bulk_email
    op: notify_user
    params:
      input: valid_recipients
      recipient: "group_email_list"
      message: "email_form.body" 
