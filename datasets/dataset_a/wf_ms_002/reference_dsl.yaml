workflow_id: wf_ms_002
# domain: clinical_ai
# complexity: 3
# has_security_constraint: true
# primitive_count: 6
# source: Clinical Analysis Research Tool -- anonymizer_service.py (HARD GATE, regex + NER, confidence 0.85)
steps:
  - id: receive_extracted_text
    op: fetch_api
    params:
      endpoint: "local://extracted_text"
    output: raw_text

  - id: apply_regex_pii_pass
    op: transform_json
    params:
      input: raw_text
      transformation: "regex_pii_detection"
    output: regex_detected

  - id: apply_ner_model_pass
    op: call_webhook
    params:
      input: regex_detected
      url: "local://ner_model"
    output: ner_detected

  - id: validate_anonymization_confidence
    op: validate_schema
    params:
      input: ner_detected
      schema: anonymization_confidence_schema
    output: validated_anon

  - id: replace_pii_with_tokens
    op: transform_json
    params:
      input: validated_anon
      transformation: "replace_pii_tokens"
    output: anonymized_text

  - id: log_anonymization
    op: log_audit
    params:
      input: anonymized_text
      action: "patient_data_anonymized" 
