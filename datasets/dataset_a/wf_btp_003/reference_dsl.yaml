workflow_id: wf_btp_003
# domain: clinical_ai
# complexity: 4
# has_security_constraint: true
# primitive_count: 8
# source: Clinical AI Platform -- POST /chat, RAG over raw + wiki, 4-layer injection defense
steps:
  - id: receive_query
    op: fetch_api
    params:
      endpoint: "/chat"
    output: user_query

  - id: authenticate_user
    op: authenticate_user
    params:
      role: "admin_or_patient"
    output: auth_result

  - id: validate_query_injection
    op: validate_schema
    params:
      input: user_query
      schema: injection_defense_schema
    output: safe_query

  - id: embed_query
    op: call_webhook
    params:
      input: safe_query
      url: "https://api.openai.com/v1/embeddings"
    output: query_embedding

  - id: search_raw_documents
    op: read_database
    params:
      table: embeddings
      filter: "doc_type = raw AND similarity > threshold"
    output: raw_results

  - id: search_wiki_pages
    op: read_database
    params:
      table: embeddings
      filter: "doc_type = wiki AND similarity > threshold"
    output: wiki_results

  - id: merge_and_validate_context
    op: merge_datasets
    params:
      input: raw_results
      secondary: wiki_results
      join_key: query_id
    output: validated_context

  - id: generate_response
    op: call_webhook
    params:
      input: validated_context
      url: "https://llm-api.example.com/v1/chat/completions"
    output: clinical_response
