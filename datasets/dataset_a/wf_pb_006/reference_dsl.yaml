workflow_id: wf_pb_006
# domain: insurance_brokerage
# complexity: 2
# has_security_constraint: false
# primitive_count: 6
# source: Insurance Brokerage Client -- A confirmar column, producer assignment dropdown
steps:
  - id: receive_assignment
    op: fetch_api
    params:
      endpoint: "/api/tickets/[id]"
    output: assignment_request

  - id: validate_assignment
    op: validate_schema
    params:
      input: assignment_request
      schema: ticket_assignment_schema
    output: validated_assignment

  - id: get_producer
    op: read_database
    params:
      table: producers
      filter: "id = producer_id AND active = true"
    output: producer

  - id: update_ticket
    op: write_database
    params:
      input: validated_assignment
      table: tickets
    output: updated_ticket

  - id: log_history
    op: log_audit
    params:
      input: updated_ticket
      action: "ticket_assigned"

  - id: notify_producer
    op: notify_user
    params:
      input: updated_ticket
      recipient: "producer_email"
      message: "New ticket assigned to you" 
