steps:
  - id: fetch_kb_candidates
    op: fetch_api
    params:
      endpoint: "/kb/candidates"
    output: candidate_results

  - id: filter_ranked_results
    op: filter_records
    params:
      input: "candidate_results"
      criteria: "relevance_threshold"
    output: ranked_results
