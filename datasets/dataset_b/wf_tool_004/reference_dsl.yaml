# source: ToolLLM benchmark -- API chaining task -- inspired by ToolLLM
steps:
  - id: fetch_from_first_api
    op: fetch_api
    params:
      endpoint: "/tools/first"
    output: first_api_data

  - id: transform_for_second_api
    op: transform_json
    params:
      input: "first_api_data"
      transformation: "to_second_api_format"
    output: transformed_data

  - id: query_second_api
    op: fetch_api
    params:
      endpoint: "/tools/second"
    output: second_api_data
