workflow_id: wf_gaia_007
# domain: general_ai
# complexity: 2
# has_security_constraint: false
# primitive_count: 3
# source: GAIA benchmark -- level 2 multi-tool task -- inspired by GAIA
steps:
  - id: search_matches
    op: fetch_api
    params:
      endpoint: "/search/subscriptions"
    output: raw_matches

  - id: filter_relevant
    op: filter_records
    params:
      input: "raw_matches"
      criteria: "relevance_threshold"
    output: relevant_matches

  - id: notify_subscriber
    op: notify_user
    params:
      input: "relevant_matches"
      recipient: "subscriber"
      message: "New relevant matches found"
