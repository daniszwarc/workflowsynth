workflow_id: wf_gaia_002
# domain: general_ai
# complexity: 1
# has_security_constraint: false
# primitive_count: 3
# source: GAIA benchmark -- level 1 tool-use task -- inspired by GAIA
steps:
  - id: lookup_price
    op: fetch_api
    params:
      endpoint: "/market/price"
    output: price_data

  - id: sanitise_price
    op: extract_field
    params:
      input: "price_data"
      field: "price"
    output: clean_price

  - id: log_price_lookup
    op: log_audit
    params:
      input: "clean_price"
      action: "price_lookup"
