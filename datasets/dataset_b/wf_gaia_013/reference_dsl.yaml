workflow_id: wf_gaia_013
# domain: general_ai
# complexity: 3
# has_security_constraint: false
# primitive_count: 5
# source: GAIA benchmark -- level 3 iterative task -- inspired by GAIA
steps:
  - id: fetch_batch
    op: fetch_api
    params:
      endpoint: "/batches/pending"
    output: batch_records

  - id: loop_over_records
    op: loop_records
    params:
      input: "batch_records"

  - id: apply_rule_per_record
    op: apply_rule
    params:
      input: "batch_records"
      rule: "per_record_rule"
    output: rule_results

  - id: collect_rule_outcomes
    op: transform_json
    params:
      input: "batch_records"
      transformation: "collect_per_record_outcomes"
    output: collected_outcomes

  - id: aggregate_results
    op: aggregate_data
    params:
      input: "collected_outcomes"
    output: summary
